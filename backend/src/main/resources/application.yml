server:
  port: 8080

spring:
  application:
    name: campus-bus
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_bus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: root
    password: 1235656
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

app:
  jwt:
    # 生产环境请通过环境变量覆盖
    secret: ${JWT_SECRET:qingtu-campus-bus-jwt-secret-key-2026-change-me}
    expire-hours: 24
  simulation:
    # 位置推进定时任务间隔（毫秒）
    rate: 30000
    # 每次推进对应的秒数（用于计算进度）
    tick-seconds: 30
    # 模拟车辆经过一个站点区间所需的秒数
    seconds-per-segment: 45

logging:
  level:
    com.qingtu.mapper: debug
